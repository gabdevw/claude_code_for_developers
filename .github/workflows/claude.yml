# Claude answers when someone writes @claude in an issue or pull request comment.
# Claude responde cuando alguien escribe @claude en un comentario de un issue o pull request.
#
# Setup / Configuración:
#   1. Run /install-github-app in Claude Code, or install the Claude GitHub app by hand.
#      Ejecuta /install-github-app en Claude Code, o instala la app de Claude para GitHub a mano.
#   2. Add the repository secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
#      Agrega el secreto del repositorio ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
# Never write the key in this file. / Nunca escribas la clave en este archivo.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
